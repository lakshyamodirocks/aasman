<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14"><title>Aasmaan Flowchart</title>
<style>
:root{--bg:#0b0e14;--card:#151a24;--line:#232a38;--ink:#e6edf6;--dim:#8b97a8;--acc:#6ea8fe;
 --done:#3fb950;--wip:#d29922;--plan:#8b97a8;--crown:#c9a227;--edge:#5b6f95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
header{position:absolute;top:0;left:0;right:0;z-index:6;background:#0b0e14e6;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 12px}
.h1{display:flex;align-items:center;gap:8px}.h1 b{font-size:15px;letter-spacing:.4px}
.h1 .sub{color:var(--dim);font-size:11px;margin-left:auto;text-align:right}
.legend{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--dim);flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.filters{display:flex;gap:6px;margin-top:7px;overflow-x:auto}
.filters button{flex:0 0 auto;background:var(--card);color:var(--dim);border:1px solid var(--line);border-radius:15px;padding:4px 10px;font-size:12px}
.filters button.on{color:#fff;border-color:var(--acc);background:#16233b}
#wrap{position:absolute;inset:0;touch-action:none}
svg{width:100%;height:100%;display:block;background:
 radial-gradient(circle at 1px 1px,#141a26 1px,transparent 0) 0 0/26px 26px,var(--bg)}
.znband{fill:#0e1420;opacity:.55}
.zntext{fill:#5c6a80;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.edge{fill:none;stroke:var(--edge);stroke-width:1.7;opacity:.85}
.edge.hot{stroke:var(--acc);stroke-width:2.4;opacity:1}
.node rect{fill:#141b27;stroke:var(--plan);stroke-width:1.6;rx:9}
.node.done rect{stroke:var(--done)} .node.wip rect{stroke:var(--wip)} .node.plan rect{stroke:var(--plan)}
.node.crown rect{stroke:var(--crown);stroke-width:2.2}
.node text{fill:var(--ink);font-size:11.5px;font-weight:500}
.node .st{font-size:9px}
.node.dim{opacity:.28} .node.sel rect{stroke-width:3;filter:drop-shadow(0 0 6px #6ea8fe88)}
.ctrl{position:absolute;right:12px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:42px;height:42px;border-radius:11px;background:#151a24e6;border:1px solid var(--line);color:var(--ink);font-size:18px}
.hint{position:absolute;left:12px;bottom:16px;z-index:6;color:var(--dim);font-size:11px;background:#0b0e14aa;padding:4px 8px;border-radius:8px}
/* drawer */
.scrim{position:fixed;inset:0;background:#000a;z-index:8;display:none}.scrim.on{display:block}
.draw{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:#0f141d;border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:9;transform:translateY(100%);transition:.22s;padding:16px}
.draw.on{transform:none}.draw .x{position:absolute;right:14px;top:12px;color:var(--dim);font-size:22px;background:none;border:none}
.draw h3{margin:0 30px 2px 0;font-size:18px}.draw .meta{color:var(--dim);font-size:12px;margin-bottom:12px}
.field{margin:0 0 12px}.field .k{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.field .v{font-size:13.5px;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#0d121b;border:1px solid var(--line);border-radius:14px;padding:4px 9px;font-size:12px}
.arrow{color:var(--dim);font-size:11px;margin:0 4px}
.stwrap{display:flex;gap:6px;margin:4px 0 12px}.stwrap button{flex:1;background:#0d121b;border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:8px;font-size:12px}
.stwrap button.on.done{border-color:var(--done);color:#b8f0c0}.stwrap button.on.wip{border-color:var(--wip);color:#f0dca0}.stwrap button.on.plan{border-color:var(--plan);color:#fff}
textarea{width:100%;background:#0d121b;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;min-height:52px}
small.hint2{color:var(--dim)}
</style></head><body>
<header>
 <div class="h1"><b>🗺 Aasmaan Flowchart</b><span class="sub" id="sub">…</span></div>
 <div class="legend">
  <span><i style="background:var(--done)"></i>Done</span><span><i style="background:var(--wip)"></i>WIP</span>
  <span><i style="background:var(--plan)"></i>Planned</span><span><i style="background:var(--crown)"></i>Crown</span>
  <span>→ flow / connection · tap box = detail</span>
 </div>
 <div class="filters" id="filters">
  <button data-f="all" class="on">All</button><button data-f="done">✅ Done</button>
  <button data-f="wip">🟡 WIP</button><button data-f="plan">⚪ Planned</button><button data-f="crown">👑 Crown</button>
 </div>
</header>
<div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5b6f95"/></marker>
  <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6ea8fe"/></marker>
 </defs>
 <g id="bands"></g><g id="edges"></g><g id="nodes"></g>
</svg></div>
<div class="ctrl"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button></div>
<div class="hint" id="hint">drag = pan · pinch/⤢ = zoom · box tap = detail</div>
<div class="scrim" id="scrim"></div><div class="draw" id="draw"></div>

 // cross-cutting keys node

const LB={done:"✅ Done",wip:"🟡 WIP",plan:"⚪ Planned"};
const KEY="akasha-board-v1";
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const stOf=e=>(store[e.id]&&store[e.id].st)||e.st;
const noteOf=e=>(store[e.id]&&store[e.id].note)||"";
const cls=s=>s==="done"?"done":s==="wip"?"wip":"plan";
const byId=id=>E.find(x=>x.id===id);
const SVGNS="http://www.w3.org/2000/svg";
// ---- layout: one column per zone (flow left->right), rows stacked ----
const COLW=200,ROWH=70,NW=150,NH=48,PADX=40,PADT=40,BANDTOP=8;
const layerOf={};Z.forEach((z,i)=>layerOf[z.id]=i);
const pos={};
(function layout(){
 const rows={};
 E.forEach(e=>{const L=layerOf[e.z];rows[L]=rows[L]||0;
  const x=PADX+L*COLW, y=PADT+BANDTOP+rows[L]*ROWH;
  pos[e.id]={x,y,w:NW,h:NH,cx:x+NW/2,cy:y+NH/2};rows[L]++;});
 window.__rows=rows;
})();
const maxRows=Math.max(...Object.values(window.__rows));
const CONTENT_W=PADX*2+ (Z.length-1)*COLW + NW;
const CONTENT_H=PADT+BANDTOP+maxRows*ROWH+40;
const svg=document.getElementById("svg");
// zone bands + labels
const bands=document.getElementById("bands");
Z.forEach((z,i)=>{
 const x=PADX+i*COLW-16;
 const r=document.createElementNS(SVGNS,"rect");
 r.setAttribute("class","znband");r.setAttribute("x",x);r.setAttribute("y",2);
 r.setAttribute("width",NW+32);r.setAttribute("height",CONTENT_H-4);r.setAttribute("rx",14);
 bands.appendChild(r);
 const t=document.createElementNS(SVGNS,"text");t.setAttribute("class","zntext");
 t.setAttribute("x",x+ (NW+32)/2);t.setAttribute("y",22);t.setAttribute("text-anchor","middle");
 t.textContent=z.name.split(" — ")[0];bands.appendChild(t);
});
// edges
const eg=document.getElementById("edges");const edgeEls=[];
function epath(s,t){const right=t.cx>=s.cx;
 const sx=right?s.x+s.w:s.x, tx=right?t.x:t.x+t.w, sy=s.cy, ty=t.cy;
 const k=Math.max(26,Math.abs(tx-sx)*0.4);
 return `M${sx},${sy} C${sx+(right?k:-k)},${sy} ${tx+(right?-k:k)},${ty} ${tx},${ty}`;}
E.forEach(e=>{(e.to||[]).forEach(tid=>{const t=byId(tid);if(!t||!pos[tid])return;
 const p=document.createElementNS(SVGNS,"path");p.setAttribute("class","edge");
 p.setAttribute("d",epath(pos[e.id],pos[tid]));p.setAttribute("marker-end","url(#ar)");
 p.dataset.a=e.id;p.dataset.b=tid;eg.appendChild(p);edgeEls.push(p);});});
// nodes
const ng=document.getElementById("nodes");
function wrap(s){ // up to 2 lines
 if(s.length<=16)return [s];
 const w=s.split(" ");let a="",b="";
 for(const x of w){ if((a+" "+x).trim().length<=16 && !b) a=(a+" "+x).trim(); else b=(b+" "+x).trim(); }
 return b?[a,b]:[a];}
function drawNodes(){ng.innerHTML="";
 E.forEach(e=>{const P=pos[e.id];const s=stOf(e);
  const g=document.createElementNS(SVGNS,"g");g.setAttribute("class","node "+cls(s)+(e.crown?" crown":""));
  g.setAttribute("transform",`translate(${P.x},${P.y})`);g.dataset.id=e.id;
  const r=document.createElementNS(SVGNS,"rect");r.setAttribute("width",NW);r.setAttribute("height",NH);r.setAttribute("rx",9);g.appendChild(r);
  const lines=wrap((e.crown?"👑 ":"")+e.n);
  lines.forEach((ln,i)=>{const tx=document.createElementNS(SVGNS,"text");
   tx.setAttribute("x",10);tx.setAttribute("y",(lines.length===1?20:15)+i*14);tx.textContent=ln;g.appendChild(tx);});
  const stt=document.createElementNS(SVGNS,"text");stt.setAttribute("class","st");stt.setAttribute("x",10);stt.setAttribute("y",NH-8);
  stt.setAttribute("fill","var(--dim)");stt.textContent=LB[s];g.appendChild(stt);
  ng.appendChild(g);
 });
}
drawNodes();
// ---- viewBox pan/zoom ----
let vb={x:0,y:0,w:CONTENT_W,h:CONTENT_H};
function apply(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
function fit(){const R=svg.getBoundingClientRect();const ar=R.width/R.height;
 let w=CONTENT_W,h=CONTENT_H; if(w/h>ar)h=w/ar; else w=h*ar;
 const hdr=(document.querySelector("header")||{}).getBoundingClientRect?document.querySelector("header").getBoundingClientRect().height:90;
 vb={x:-(w-CONTENT_W)/2, y:-(hdr/R.height)*h-12, w, h};apply();}
svg.setAttribute("preserveAspectRatio","xMidYMid meet");fit();
function zoom(f,cx,cy){const R=svg.getBoundingClientRect();
 cx=cx==null?R.width/2:cx; cy=cy==null?R.height/2:cy;
 const px=vb.x+(cx-R.left)/R.width*vb.w, py=vb.y+(cy-R.top)/R.height*vb.h;
 vb.w*=f;vb.h*=f;vb.x=px-(cx-R.left)/R.width*vb.w;vb.y=py-(cy-R.top)/R.height*vb.h;apply();}
document.getElementById("zin").onclick=()=>zoom(0.8);
document.getElementById("zout").onclick=()=>zoom(1.25);
document.getElementById("zfit").onclick=fit;
// pointer pan + pinch, tap detect
let pts=new Map(),moved=false,startVB=null,pd0=0;
const wrapEl=document.getElementById("wrap");
wrapEl.addEventListener("pointerdown",ev=>{wrapEl.setPointerCapture(ev.pointerId);
 pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});moved=false;startVB={...vb};
 if(pts.size===2){const a=[...pts.values()];pd0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
wrapEl.addEventListener("pointermove",ev=>{if(!pts.has(ev.pointerId))return;
 const R=svg.getBoundingClientRect();
 if(pts.size===1){const p=pts.get(ev.pointerId);const dx=(ev.clientX-p.x)*vb.w/R.width,dy=(ev.clientY-p.y)*vb.h/R.height;
  if(Math.abs(ev.clientX-p.x)+Math.abs(ev.clientY-p.y)>5)moved=true;
  vb.x=startVB.x-dx;vb.y=startVB.y-dy;apply();}
 else if(pts.size===2){pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});const a=[...pts.values()];
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd0){zoom(pd0/d,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);}pd0=d;moved=true;return;}
 pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});});
function up(ev){pts.delete(ev.pointerId);if(pts.size<2)pd0=0;}
wrapEl.addEventListener("pointerup",up);wrapEl.addEventListener("pointercancel",up);
wrapEl.addEventListener("wheel",ev=>{ev.preventDefault();zoom(ev.deltaY>0?1.12:0.9,ev.clientX,ev.clientY);},{passive:false});
// tap node
ng.addEventListener("click",ev=>{if(moved)return;const g=ev.target.closest(".node");if(g)open_(byId(g.dataset.id));});
// filter = dim non-matching
let filter="all";
function applyFilter(){document.querySelectorAll(".node").forEach(g=>{const e=byId(g.dataset.id);
 const match=filter==="all"|| (filter==="crown"?e.crown:stOf(e)===filter);
 g.classList.toggle("dim",!match);});}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;applyFilter();});
// highlight connected edges + neighbours
function highlight(id){edgeEls.forEach(p=>{const on=p.dataset.a===id||p.dataset.b===id;
  p.classList.toggle("hot",on);p.setAttribute("marker-end",on?"url(#arh)":"url(#ar)");});
 document.querySelectorAll(".node").forEach(g=>g.classList.toggle("sel",g.dataset.id===id));}
function clearHi(){edgeEls.forEach(p=>{p.classList.remove("hot");p.setAttribute("marker-end","url(#ar)");});
 document.querySelectorAll(".node").forEach(g=>g.classList.remove("sel"));}
// progress
function prog(){let d=0,w=0,p=0;E.forEach(e=>{const s=stOf(e);if(s==="done")d++;else if(s==="wip")w++;else p++;});
 document.getElementById("sub").innerHTML=`${E.length} · <span style="color:var(--done)">${d}✅</span> <span style="color:var(--wip)">${w}🟡</span> <span style="color:var(--dim)">${p}⚪</span>`;}
prog();
// drawer
function open_(e){const s=stOf(e);highlight(e.id);
 const conns=(e.to||[]).map(id=>{const t=byId(id);return t?`<span class="chip" onclick="jump('${id}')">${t.n}</span>`:"";}).join("");
 const back=E.filter(x=>(x.to||[]).includes(e.id)).map(x=>`<span class="chip" onclick="jump('${x.id}')">${x.n}</span>`).join("");
 const zn=(Z.find(z=>z.id===e.z)||{}).name||e.z;
 const dr=document.getElementById("draw");
 dr.innerHTML=`<button class="x" onclick="close_()">✕</button>
  <h3>${e.crown?"👑 ":""}${e.n}</h3><div class="meta">${zn}</div>
  <div class="field"><div class="k">Purpose — kyun hai</div><div class="v">${e.purpose}</div></div>
  <div class="field"><div class="k">Use — kaise</div><div class="v">${e.use}</div></div>
  <div class="field"><div class="k">Ways — tarika</div><div class="v">${e.ways}</div></div>
  <div class="field"><div class="k">Aage jaata hai → (connected)</div><div class="chips">${conns||'<small class="hint2">—</small>'}</div></div>
  ${back?`<div class="field"><div class="k">← Isse aata hai</div><div class="chips">${back}</div></div>`:""}
  <div class="field"><div class="k">Status</div><div class="stwrap">
   <button class="${s==='plan'?'on plan':''}" onclick="setSt('${e.id}','plan')">⚪ Planned</button>
   <button class="${s==='wip'?'on wip':''}" onclick="setSt('${e.id}','wip')">🟡 WIP</button>
   <button class="${s==='done'?'on done':''}" onclick="setSt('${e.id}','done')">✅ Done</button></div></div>
  <div class="field"><div class="k">Tere notes</div><textarea id="note" placeholder="is element pe kaam…">${noteOf(e).replace(/</g,'&lt;')}</textarea></div>`;
 dr.querySelector("#note").oninput=ev=>{store[e.id]=store[e.id]||{};store[e.id].note=ev.target.value;save();};
 document.getElementById("scrim").classList.add("on");dr.classList.add("on");}
window.jump=id=>{const e=byId(id);if(e){open_(e);}};
window.setSt=(id,s)=>{store[id]=store[id]||{};store[id].st=s;save();drawNodes();applyFilter();prog();open_(byId(id));};
window.close_=()=>{document.getElementById("scrim").classList.remove("on");document.getElementById("draw").classList.remove("on");clearHi();};
document.getElementById("scrim").onclick=close_;
setTimeout(()=>{const h=document.getElementById("hint");if(h)h.style.opacity=".5";},4000);
</script></body></html>
